# Form definitions. Element types and appearance follow ODK conventions.

forms:
  initiatives_form:
    label: Initiatives
    default_table: initiatives
    elements:
      name:
        type: string
        label: Name
        required: true
      description:
        type: string
        label: Description
        appearance: multiline
      responsible_person:
        type: select_one
        appearance: dropdown
        required: true
        label: Responsible Person
        parameters:
          source_table: people
          value_column: id
          label_column: name
      tag_groups:
        type: subform
        label: Tag Groups
        parameters:
          source_table: tag_groups
          value_column: id
          label_column: name
      status: &status_form_config
        type: select_one
        label: Status
        status_list:
          - active
          - deleted
        list_name: status_list
        default: active
      parents:
        type: select_multiple
        appearance: dropdown
        label: Parent Initiatives
        parameters:
          source_table: initiatives
          value_column: id
          label_column: name
        store:
          link_table: initiative_initiative_links
          source_field: child_id
          target_field: parent_id
          orientation: self
      children:
        type: select_multiple
        appearance: dropdown
        label: Child Initiatives
        parameters:
          source_table: initiatives
          value_column: id
          label_column: name
        store:
          link_table: initiative_initiative_links
          source_field: parent_id
          target_field: child_id
          orientation: self
      activities_links:
        type: select_multiple
        appearance: dropdown
        label: Linked Activities
        parameters:
          source_table: activities
          value_column: id
          label_column: name
        store:
          link_table: activity_initiative_links
          source_field: initiative_id
          target_field: activity_id
          orientation: forward
      contracts_links:
        type: select_multiple
        appearance: dropdown
        label: Linked Contracts
        parameters:
          source_table: contracts
          value_column: id
          label_column: name
        store:
          link_table: contract_initiative_links
          source_field: initiative_id
          target_field: contract_id
          orientation: forward
    meta:
      id:
        strategy: uuid
        editable: false
      version:
        strategy: increment
      timestamp:
        strategy: now
      created_by:
        strategy: current_user
  people_form:
    label: People
    default_table: people
    elements:
      name:
        type: string
        label: Name
        required: true
      role:
        type: string
        label: Role
      email:
        type: email
        label: Email
      active:
        type: boolean
        label: Active
      tag_groups:
        type: subform
        label: Tag Groups
        parameters:
          source_table: tag_groups
          value_column: id
          label_column: name
      status: *status_form_config
      organisations_links:
        type: select_multiple
        appearance: dropdown
        label: Linked Organisations
        parameters:
          source_table: organisations
          value_column: id
          label_column: name
        store:
          link_table: organisation_people_links
          source_field: person_id
          target_field: organisation_id
          orientation: forward
      activities_links:
        type: select_multiple
        appearance: dropdown
        label: Linked Activities
        parameters:
          source_table: activities
          value_column: id
          label_column: name
        store:
          link_table: activity_people_links
          source_field: person_id
          target_field: activity_id
          orientation: forward
    meta:
      id:
        strategy: uuid
        editable: false
      version:
        strategy: increment
      timestamp:
        strategy: now
      created_by:
        strategy: current_user
  organisations_form:
    label: Organisations
    default_table: organisations

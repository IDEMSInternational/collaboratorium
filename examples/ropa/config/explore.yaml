# The Explore page over the register.
#
# The star schema means every useful register view is a grouping of one fact
# along a different dimension, so the views below differ only in which
# dimension they start from and which they keep.

node_tables:
- processing_records
- scopes
- data_fields
- purposes
- data_subject_categories
- organisations
- people
- agreements
- justifications
- assessments
network_vis:
  layout:
    name: cose-bilkent
  stylesheet:
  - selector: node
    style:
      label: data(label)
      text-valign: center
      text-halign: center
      font-size: 12px
      width: 60px
      height: 60px
  - selector: edge
    style:
      curve-style: bezier
      target-arrow-shape: triangle
      font-size: 10px
  # The fact is the only rectangle, so a graph of anything reads as "these
  # dimensions, hung off these rows".
  - selector: .processing_records
    style:
      background-color: '#9b51e0'
      shape: rectangle
      text-wrap: wrap
      text-max-width: 60px
  - selector: .scopes
    style:
      background-color: '#ff6900'
      shape: round-rectangle
      text-wrap: wrap
      text-max-width: 60px
  - selector: .data_fields
    style:
      background-color: '#649ba3'
      shape: hexagon
      text-wrap: wrap
      text-max-width: 60px
  - selector: .purposes
    style:
      background-color: '#fcb900'
      shape: diamond
      text-wrap: wrap
      text-max-width: 60px
  - selector: .data_subject_categories
    style:
      background-color: '#98FB98'
      shape: ellipse
      text-wrap: wrap
      text-max-width: 60px
  - selector: .organisations
    style:
      background-color: '#649ba3'
      shape: hexagon
      text-wrap: wrap
      text-max-width: 60px
  - selector: .people
    style:
      background-color: '#fcb900'
      shape: ellipse
      text-wrap: wrap
      text-max-width: 60px
  - selector: .agreements
    style:
      background-color: '#98FB98'
      shape: round-rectangle
      text-wrap: wrap
      text-max-width: 60px
  - selector: .justifications
    style:
      background-color: '#c0c0c0'
      shape: round-rectangle
      text-wrap: wrap
      text-max-width: 60px
  - selector: .assessments
    style:
      background-color: '#dc3545'
      shape: round-rectangle
      text-wrap: wrap
      text-max-width: 60px

filter_registry:
  target-entity:
    label: "Target Entity"
    type: select_multiple
    appearance: dropdown
    parameters:
      source_tables: [scopes, data_fields, purposes, organisations, agreements]
  degree-val:
    label: "Degrees of Separation"
    type: integer
    parameters:
      min: 1
      max: 100
      default: 1
  node-type-filter:
    label: "Visible Node Types"
    type: select_multiple
    appearance: checkboxes
  degree-inout:
    label: "Traverse Direction"
    type: select_multiple
    appearance: checkboxes
    parameters:
      options:
        parents: " Parents"
        children: " Children"

views:
  view-all:
    name: "All Filters & Settings"
    icon: "bi-list-check"
    layout: "cose-bilkent"
    pipeline: []
    active_filters:
      target-entity:
      node-type-filter:
      degree-val:
      degree-inout:

  # "Everything we share with X" — the question the activity-centred model is
  # weak at, and the reason the fact is a flow rather than an activity.
  view-recipient:
    name: "What Goes To This Recipient"
    icon: "bi-box-arrow-up-right"
    layout: "dagre"
    pipeline:
      - filter: NodeTypeFilter
        allowed_types: ['organisations']
      - filter: SaveSet
        set_name: "recipients"
      - filter: TraversalFilter
        direction: both
        max_depth: 1
        allowed_types: ['processing_records']
        accumulate: true
      - filter: TraversalFilter
        direction: both
        max_depth: 1
        allowed_types: ['data_fields', 'purposes', 'agreements']
        accumulate: true
      - filter: Union
        with_set: "recipients"
    active_filters:
      target-entity:
        parameters:
          source_tables: [organisations]
      node-type-filter:

  # A subject access request scoped to one deployment: start at the scope, and
  # collect the fields it processes and who they reach.
  view-scope:
    name: "What This Scope Processes"
    icon: "bi-diagram-3"
    layout: "dagre"
    pipeline:
      - filter: NodeTypeFilter
        allowed_types: ['scopes']
      - filter: SaveSet
        set_name: "scope_seed"
      - filter: TraversalFilter
        direction: both
        max_depth: 1
        allowed_types: ['processing_records']
        accumulate: true
      - filter: TraversalFilter
        direction: both
        max_depth: 1
        allowed_types: ['data_fields', 'data_subject_categories', 'organisations']
        accumulate: true
      - filter: Union
        with_set: "scope_seed"
    active_filters:
      target-entity:
        parameters:
          source_tables: [scopes]
      node-type-filter:

  # Which records rest on a given written justification — the query that has to
  # work before editing a shared assessment can be considered safe.
  view-justification-reach:
    name: "What Rests On This Justification"
    icon: "bi-journal-text"
    layout: "dagre"
    pipeline:
      - filter: NodeTypeFilter
        allowed_types: ['justifications', 'assessments']
      - filter: SaveSet
        set_name: "prose"
      - filter: TraversalFilter
        direction: both
        max_depth: 2
        allowed_types: ['assessments', 'processing_records']
        accumulate: true
      - filter: Union
        with_set: "prose"
    active_filters:
      target-entity:
        parameters:
          source_tables: [justifications, assessments]
      node-type-filter:

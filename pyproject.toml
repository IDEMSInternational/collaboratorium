[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pantograph"
version = "0.1.0"
description = "A config-driven database viewer and form engine"
# 3.12 is a hard floor, not a preference: form_gen.py nests same-type quotes
# inside f-strings (PEP 701), which is a SyntaxError on 3.11 and earlier.
requires-python = ">=3.12"
dependencies = [] # Relying on your existing requirements.txt

# So that `pantograph export-contract` works as documented. It is the same
# entry as `python -m pantograph`, which the Dockerfile's ENTRYPOINT uses and
# which still serves when given no subcommand.
[project.scripts]
pantograph = "pantograph.__main__:main"

# Page plugins are discovered through this group, so moving one out of this
# repository into its own distribution is a packaging change and nothing else —
# no core code refers to any plugin by name.
[project.entry-points."pantograph.plugins"]
explore = "pantograph_explore.plugin:Plugin"
dashboard = "pantograph_dashboard.plugin:Plugin"
import = "pantograph_import.plugin:Plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `evidence` tests are kept as a record of a specific past incident and are not
# part of the everyday run (see the marker below). Everything runs with
# `pytest -o addopts=""`, which is what the release workflow does.
addopts = "-m 'not evidence'"
markers = [
    "evidence: pins one past incident (its docstring says which), covered in general by the full-shape smoke test; kept on record and run on release, not on every change",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The producer-facing docs ship inside the package, because the handoff bundle
# is built from them at runtime and the Docker image carries src/ and no docs/.
[tool.setuptools.package-data]
pantograph = ["producer_docs/*.md"]
